# XcodeGen 설정. `cd ios/App && xcodegen generate`로 Chalkak.xcodeproj를 만든다(프로젝트 파일은 커밋하지 않는다).
name: Chalkak
options:
  bundleIdPrefix: com.stonefive
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
packages:
  ChalkakKit:
    path: ../ChalkakKit
  KakaoSDK:
    url: https://github.com/kakao/kakao-ios-sdk
    from: 2.29.0
  libwebp:
    url: https://github.com/SDWebImage/libwebp-Xcode
    from: 1.1.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Chalkak:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: 찰캌
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Light
        API_BASE_URL: $(API_BASE_URL)
        KAKAO_NATIVE_APP_KEY: $(KAKAO_NATIVE_APP_KEY)
        FORCE_UPDATE_ENABLED: $(FORCE_UPDATE_ENABLED)
        APP_STORE_URL: $(APP_STORE_URL)
        NSCameraUsageDescription: 작품 사진을 촬영하기 위해 카메라를 사용해요.
        NSPhotoLibraryAddUsageDescription: 촬영한 사진과 달력 이미지를 사진 보관함에 저장하기 위해 필요해요.
        LSApplicationQueriesSchemes:
          - kakaokompassauth
          - kakaolink
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - kakao$(KAKAO_NATIVE_APP_KEY)
        UIAppFonts:
          - Continuous-Regular.otf
          - GriunXHangeulBanguri-Regular.ttf
          - Pretendard-Bold.otf
          - Pretendard-Regular.otf
          - Pretendard-SemiBold.otf
    # 푸시 알림(APNs) 권한. 배포 서명 시 Xcode가 production으로 바꾼다. Firebase는 의존성에 없다(FCM 토큰은 자리표시자).
    entitlements:
      path: Sources/Chalkak.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        # 카카오 콘솔에 등록된 원본 앱 번들 ID(Q-15). Flutter 앱과 같으니 시뮬레이터를 플랫폼별로 나눠 쓴다.
        PRODUCT_BUNDLE_IDENTIFIER: com.stonefive.chalkak
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - package: ChalkakKit
        product: ChalkakCore
      - package: ChalkakKit
        product: ChalkakNetwork
      - package: ChalkakKit
        product: ChalkakData
      - package: ChalkakKit
        product: ChalkakFeatures
      - package: KakaoSDK
        product: KakaoSDKAuth
      - package: KakaoSDK
        product: KakaoSDKUser
      - package: libwebp
        product: libwebp
  ChalkakUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Chalkak
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
schemes:
  Chalkak:
    build:
      targets:
        Chalkak: all
        ChalkakUITests: [test]
    test:
      targets: [ChalkakUITests]
