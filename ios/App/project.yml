# XcodeGen 설정. `cd ios/App && xcodegen generate`로 Chalkak.xcodeproj를 만든다(프로젝트 파일은 커밋하지 않는다).
name: Chalkak
options:
  bundleIdPrefix: com.stonefive
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
packages:
  ChalkakKit:
    path: ../ChalkakKit
  KakaoSDK:
    url: https://github.com/kakao/kakao-ios-sdk
    from: 2.29.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  libwebp:
    url: https://github.com/SDWebImage/libwebp-Xcode
    from: 1.1.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Chalkak:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    # Firebase 설정 파일(Config/GoogleService-Info.plist)은 저장소에 없고(gitignore) 로컬·배포에서 주입한다(ios/README.md 참고).
    # 소스로 등록하면 파일이 없을 때 빌드가 깨지므로, 있을 때만 앱 번들에 복사한다.
    postBuildScripts:
      - name: Copy GoogleService-Info.plist if present
        basedOnDependencyAnalysis: false
        script: |
          PLIST="${PROJECT_DIR}/Config/GoogleService-Info.plist"
          if [ -f "$PLIST" ]; then
            cp "$PLIST" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist"
          fi
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: 찰캌
        # 런치 스크린: 로고 배경색과 로고 이미지(원본 Info.plist와 같다). 스플래시 화면(SplashView)이 같은 모양으로 이어 받는다.
        UILaunchScreen:
          UIColorName: ChalkakLogoBackground
          UIImageName: ChalkakLaunchLogo
          UIImageRespectsSafeAreaInsets: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Light
        # APNs 토큰을 AppDelegate에서 Firebase에 직접 넘기므로 자동 프록시(스위즐링)는 끈다.
        FirebaseAppDelegateProxyEnabled: false
        API_BASE_URL: $(API_BASE_URL)
        KAKAO_NATIVE_APP_KEY: $(KAKAO_NATIVE_APP_KEY)
        FORCE_UPDATE_ENABLED: $(FORCE_UPDATE_ENABLED)
        APP_STORE_URL: $(APP_STORE_URL)
        NSCameraUsageDescription: 작품 사진을 촬영하기 위해 카메라를 사용해요.
        NSPhotoLibraryAddUsageDescription: 촬영한 사진과 달력 이미지를 사진 보관함에 저장하기 위해 필요해요.
        LSApplicationQueriesSchemes:
          - kakaokompassauth
          - kakaolink
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - kakao$(KAKAO_NATIVE_APP_KEY)
        UIAppFonts:
          - Continuous-Regular.otf
          - GriunXHangeulBanguri-Regular.ttf
          - Pretendard-Bold.otf
          - Pretendard-Regular.otf
          - Pretendard-SemiBold.otf
    # 푸시 알림(APNs) 권한. 배포 서명 시 Xcode가 production으로 바꾼다.
    entitlements:
      path: Sources/Chalkak.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        # 카카오 콘솔에 등록된 원본 앱 번들 ID(Q-15). Flutter 앱과 같으니 시뮬레이터를 플랫폼별로 나눠 쓴다.
        PRODUCT_BUNDLE_IDENTIFIER: com.stonefive.chalkak
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        # 서명이 없으면 키체인 저장이 -34018로 실패해 로그인 세션이 남지 않는다. 시뮬레이터는 ad-hoc 서명으로 빌드한다.
        CODE_SIGNING_ALLOWED: YES
        # 위 복사 스크립트가 선언되지 않은 입력 파일을 읽으므로 스크립트 샌드박스를 끈다.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    dependencies:
      - package: ChalkakKit
        product: ChalkakCore
      - package: ChalkakKit
        product: ChalkakNetwork
      - package: ChalkakKit
        product: ChalkakData
      - package: ChalkakKit
        product: ChalkakFeatures
      - package: KakaoSDK
        product: KakaoSDKAuth
      - package: KakaoSDK
        product: KakaoSDKUser
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseAnalytics
      - package: libwebp
        product: libwebp
  ChalkakUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Chalkak
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
schemes:
  Chalkak:
    build:
      targets:
        Chalkak: all
        ChalkakUITests: [test]
    test:
      targets: [ChalkakUITests]
