name: chalkak
description: "찰캌 Flutter 클라이언트"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  clock: ^1.1.3
  crypto: ^3.0.8
  dio: ^5.11.1
  flutter:
    sdk: flutter
  # 업로드: 편집한 사진을 손실 WebP로 압축한다(네이티브 인코더).
  flutter_image_compress: ^2.5.1
  flutter_secure_storage: ^11.2.0
  gal: ^2.3.3
  go_router: ^18.1.1
  # 업로드: 시스템 사진 선택기와 카메라로 한 장 가져온다.
  image_picker: ^1.2.4
  kakao_flutter_sdk_user: ^2.1.0
  # 업로드: 압축한 WebP를 앱 임시 폴더에 두고 제출 뒤 지운다.
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
