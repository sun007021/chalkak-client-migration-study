name: android

on:
  pull_request:
    paths:
      - 'android/**'
      - 'shared/**'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'shared/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # Korean test names become class file names; POSIX locale makes the Kotlin compiler fail with InvalidPathException.
  LC_ALL: C.UTF-8

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # ubuntu-latest ships an Android SDK (ANDROID_HOME), so :app is included in the build.
      - name: Pure Kotlin modules and app unit tests
        run: ./gradlew test :app:testDebugUnitTest --continue
      - name: Debug APK
        run: ./gradlew :app:assembleDebug
