name: android

on:
  pull_request:
    paths:
      - 'android/**'
      - 'shared/**'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'shared/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # Korean test names become class file names; POSIX locale makes the Kotlin compiler fail with InvalidPathException.
  LC_ALL: C.UTF-8

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The runner image ships an Android SDK (ANDROID_HOME), so :app is included in the build. Install what :app needs
      # explicitly (idempotent) instead of relying on the image's preinstalled platform list.
      - name: Android SDK packages
        working-directory: .
        run: |
          test -n "$ANDROID_HOME" || { echo "ANDROID_HOME is not set"; exit 1; }
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      # Without an SDK settings.gradle.kts silently drops :app and the build would pass green without it.
      - name: Require the :app module
        run: ./gradlew projects | grep -q "Project ':app'"
      - name: Pure Kotlin modules and app unit tests
        run: ./gradlew test :app:testDebugUnitTest --continue
      - name: Debug APK
        run: ./gradlew :app:assembleDebug
