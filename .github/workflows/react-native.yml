name: react-native

on:
  pull_request:
    paths:
      - 'react-native/**'
      - '.github/workflows/react-native.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-native/package-lock.json
      - run: npm ci
      - run: npm run verify
