org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
# Korean test names become Korean .class file names; the Kotlin daemon needs a UTF-8 file-name encoding
# even when the shell locale is POSIX (CI containers).
kotlin.daemon.jvm.options=-Dfile.encoding=UTF-8,-Dsun.jnu.encoding=UTF-8
org.gradle.caching=true
kotlin.code.style=official
